}
:root[data-theme=dark]{--bg:var(--stone-900);--bg-raised:var(--stone-800);--bg-sunken:#12100D;--text:var(--stone-100);--text-muted:var(--stone-300);--text-subtle:var(--stone-400);--border:var(--stone-700);--border-strong:var(--stone-400);--primary:var(--accent-600);--primary-hover:var(--accent-500);--link:var(--accent-300);--selected:var(--accent-300);--selected-bg:var(--accent-700);--success:#5FAE84;--success-bg:#17241E;--warning:#C79341;--warning-bg:#2A2115;--danger:#E08670;--danger-bg:#2A1A17;--on-danger:var(--stone-900);--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{scroll-behavior:auto}body{font:15px/1.5 var(--font);background:var(--bg-sunken);color:var(--text);margin:0}a{color:var(--link)}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.control{position:sticky;z-index:100;top:0;background:var(--bg-raised);border-bottom:1px solid var(--border);padding:var(--s3);display:flex;gap:var(--s3);flex-wrap:wrap;align-items:end}.control>strong{margin-right:auto}.control label{display:grid;gap:2px;color:var(--text-muted);font-size:12px}.control select,.control button{min-height:var(--alto-control-md);border:1px solid var(--border-strong);background:var(--bg-raised);border-radius:var(--r-md);padding:4px 9px}.control button{cursor:pointer}.control .status{font-size:11px;flex-basis:100%;color:var(--text-muted)}
.stage{padding:var(--s5);display:flex;align-items:center;justify-content:center;min-width:0}.frame{width:100%;max-width:1280px;min-height:710px;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-lg);position:relative}.stage.mobile .frame{width:390px;max-width:100%;height:844px;min-height:620px;overflow-y:auto;overflow-x:hidden}.inner{min-height:650px}

.btn{border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--bg-raised);color:var(--text);padding:9px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:var(--s2);max-width:100%;overflow-wrap:anywhere;transition:opacity var(--duracion-control) var(--curva-entrada)}.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.btn.ghost{border-color:transparent;color:var(--link)}.btn.danger{color:var(--danger)}.btn:disabled{cursor:not-allowed;opacity:.55}.actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s4)}.card{border:1px solid var(--border);background:var(--bg-raised);border-radius:var(--r-lg);overflow:hidden;min-width:0}.body{padding:var(--s4)}.body h2{font-size:17px;margin:0 0 var(--s2);overflow-wrap:anywhere}.body p{color:var(--text-muted);margin:0 0 var(--s2)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}.media{aspect-ratio:3/2;background:var(--bg-sunken);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:var(--s5);color:var(--text-muted);overflow-wrap:anywhere}.media.tall{aspect-ratio:4/3;border:1px solid var(--border);border-radius:var(--r-lg)}.tag{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--bg-sunken);border-radius:var(--r-sm);padding:2px 7px;font-size:12px}.price{font-size:15px;font-weight:650;color:var(--text);margin-top:var(--s3)}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:var(--s6);align-items:start}.hero h1{overflow-wrap:anywhere}.state{padding:var(--s6);border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--bg-raised);max-width:650px;margin:auto;text-align:center}.state h2{font-size:20px;margin:0 0 var(--s2)}.state p{color:var(--text-muted);margin:0 0 var(--s4)}.alert{border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--bg-raised);padding:var(--s4);display:grid;gap:var(--s2);margin:var(--s4) 0;max-width:720px}.alert.danger{border-left:4px solid var(--danger)}.alert.warning{border-left:4px solid var(--warning)}.muted{color:var(--text-muted)}.skeleton{height:15px;border-radius:var(--r-sm);background:var(--bg-sunken);border:1px solid var(--border);margin:var(--s3) 0}.skeleton.wide{width:88%}.skeleton.short{width:48%}.loading{display:inline-flex;align-items:center;gap:var(--s2);color:var(--text-muted)}.ring{width:15px;height:15px;border:2px solid var(--border-strong);border-top-color:var(--primary);border-radius:50%;animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.admin{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:650px}.sidebar{border-right:1px solid var(--border);background:var(--bg-raised);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}.sidebar a{padding:10px;border-radius:var(--r-md);text-decoration:none;color:var(--text-muted)}.sidebar a.active{background:var(--selected-bg);color:var(--selected);font-weight:700}.sidebar small{margin-top:auto;color:var(--text-subtle)}.workspace{min-width:0}.top-admin{background:var(--bg-raised);border-bottom:1px solid var(--border);min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);gap:var(--s3)}.admin-content{padding:var(--s5);max-width:1040px;margin:auto}.admin-title{display:flex;align-items:start;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5);flex-wrap:wrap}.admin-title h1{font-size:25px;margin:0}.list{display:grid;gap:var(--s3)}.listrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:var(--s3);padding:var(--s3);border-bottom:1px solid var(--border);align-items:center;min-width:0}.listrow>*{min-width:0;overflow-wrap:anywhere}.table{border:1px solid var(--border);background:var(--bg-raised);border-radius:var(--r-lg);overflow:hidden}.headrow{color:var(--text-subtle);font-size:12px;font-weight:700;background:var(--bg-sunken)}.form{max-width:760px;display:grid;gap:var(--s4)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}.field{display:grid;gap:var(--s1);min-width:0}.field label{font-weight:650}.field input,.field textarea{background:var(--bg-raised);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:var(--s3);width:100%;min-height:44px}.field textarea{min-height:104px;resize:vertical}.field .error{font-size:13px;color:var(--danger)}.field input[aria-invalid=true]{border:2px solid var(--danger)}.divider{border:0;border-top:1px solid var(--border);margin:var(--s5) 0}
.pub-footer{max-width:1080px;margin:auto;border-top:1px solid var(--border);padding:var(--s4) var(--s5);color:var(--text-subtle);font-size:12px}.demo-note{padding:var(--s3);background:var(--bg-sunken);color:var(--text-muted);border-top:1px solid var(--border);font-size:12px}.nav-callout{padding:var(--s4);border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-raised);margin:var(--s4) 0}.space{height:var(--s5)}.frame .keyboard-note{font-size:12px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:var(--s2)}
.mobile-menu{display:none}.admin-overlay{position:absolute;inset:0;background:var(--velo-dialogo);z-index:11}.navdrawer{position:absolute;inset:0 auto 0 0;width:min(310px,calc(100% - 32px));background:var(--bg-raised);z-index:12;padding:var(--s4);box-shadow:var(--shadow-lg)}.navdrawer h2{margin:0}.navdrawer button{width:100%;text-align:left;margin-top:var(--s3)}
.stage.mobile .page{padding:var(--s5) var(--s4) var(--s7)}.stage.mobile .top-public{padding:var(--s3) var(--s4)}.stage.mobile .grid{grid-template-columns:1fr}.stage.mobile .hero{grid-template-columns:1fr}.stage.mobile .admin{grid-template-columns:minmax(0,1fr)}.stage.mobile .sidebar{display:none}.stage.mobile .top-admin{padding:var(--s2)}.stage.mobile .mobile-menu{display:inline-flex}.stage.mobile .admin-content{padding:var(--s4)}.stage.mobile .listrow{grid-template-columns:1fr auto;gap:var(--s1)}.stage.mobile .listrow .hide-mobile{display:none}.stage.mobile .form-row{grid-template-columns:1fr}.stage.mobile .admin-title{display:block}.stage.mobile .admin-title>.btn{margin-top:var(--s3)}.stage.mobile .page h1{font-size:24px}.stage.mobile .state{padding:var(--s5) var(--s3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-property:opacity!important;transition-duration:var(--duracion-cambio-reducido)!important;transform:none!important}}

<body>
<div class="control">
 <strong>Diseño M05a · referencia, no producto</strong>
 <label>Superficie<select id="surface"><option value="list">1 · Listado público</option><option value="detail">2 · Ficha pública</option><option value="admin-list">3 · Administración: listado</option><option value="editor">4 · Administración: editor</option><option value="nav">5 · Contribuciones de navegación</option></select></label>
 <label>Estado<select id="state"><option value="data">Con datos</option><option value="empty">Vacío</option><option value="loading">Cargando</option><option value="error">Error</option><option value="conflict">Conflicto</option></select></label>
 <label>Tamaño<select id="device"><option value="mobile">390 px · móvil</option><option value="desktop">1280 px · escritorio</option></select></label>
 <label>Tema de roles<select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
 <label>Variante<select id="variant"><option value="normal">Normal</option><option value="image">Imagen ausente</option><option value="unpublished">Servicio despublicado</option><option value="invalid">Campos inválidos</option><option value="simultaneous">Edición simultánea</option><option value="network">Fallo de red al guardar</option><option value="off">Módulo desactivado</option></select></label>
 <span class="status" id="comment">Instantánea de tokens SILLAR solo para ensayar roles; las pantallas públicas requieren el tema real del cliente para aprobarse. Datos ilustrativos, no contenido comercial.</span>
</div>
<div class="stage mobile" id="stage"><section class="frame" id="frame"><div class="inner" id="render" aria-live="polite"></div></section></div>
<script>
const $=(x)=>document.getElementById(x);
const val=(id)=>$(id).value;
const button=(text,go,klass='')=>`<button class="btn ${klass}" data-go="${go}">${text}</button>`;
const link=(text,go)=>`<button class="btn ghost" data-go="${go}">${text}</button>`;
const sample={name:'Anillado espiral',other:'Impresión láser'};
const media=(name,variant='')=>`<div class="media ${variant==='tall'?'tall':''}" role="img" aria-label="${name}: imagen no disponible">${variant==='failed'?'La imagen ya no está disponible':'Servicio · sin imagen'}</div>`;
const badge=(s)=>`<span class="tag">${s}</span>`;
const alert=(title,desc,action='retry',label='Volver a intentar',tone='danger')=>`<div class="alert ${tone}" role="alert"><strong>${title}</strong><span>${desc}</span>${action?`<div>${button(label,action)}</div>`:''}</div>`;
const empty=(title,desc,action,label)=>`<div class="state"><h2>${title}</h2><p>${desc}</p>${action?button(label,action,'primary'):''}</div>`;
const spinner=(name)=>`<div class="loading" role="status"><span class="ring" aria-hidden="true"></span>${name}</div>`;
const publicTop=()=>`<div class="top-public"><strong class="brand">[Nombre del negocio]</strong><span class="small">Sitio del negocio</span></div>`;
const footer=()=>`<div class="pub-footer">Las contribuciones reales del pie pertenecen a la plataforma y a los módulos activos. Este bloque solo señala su ubicación, no inventa contenido.</div>`;
const publicWrap=(body)=>publicTop()+`<main class="page" id="contenido" tabindex="-1">${body}</main>`;
let drawer=false;
function adminWrap(body){return `<div class="admin"><aside class="sidebar" aria-label="Navegación de ejemplo"><strong>Panel</strong><a href="#" data-go="nav">Inicio</a><a class="active" href="#" data-go="admin-list">Servicios</a><small>SILLAR · tema del panel</small></aside><div class="workspace"><header class="top-admin"><button class="btn mobile-menu" data-go="drawer" aria-label="Abrir navegación">☰</button><strong>[Nombre del negocio]</strong><span class="small">Cuenta</span></header><main class="admin-content" id="contenido" tabindex="-1">${body}</main></div></div>${drawer?`<div class="admin-overlay" data-go="close-drawer"></div><section class="navdrawer" role="dialog" aria-modal="true" aria-label="Navegación"><h2>Navegación</h2>${button('Cerrar navegación','close-drawer')}${button('Inicio','nav')}${button('Servicios','admin-list','primary')}<p class="small">Representación visual. En el producto se reutiliza el Drawer existente con useFocusTrap.</p></section>`:''}`}
function sList(state,variant){
 const head=`<div class="eyebrow">Servicios</div><h1>Servicios</h1><p class="desc">Conoce los servicios que ofrece el negocio.</p>`;
 if(state==='empty')return publicWrap(head+empty('Todavía no hay servicios publicados','Cuando se publiquen aparecerán aquí.'));
 if(state==='loading')return publicWrap(head+`<section aria-label="Carga de servicios" class="grid">${[1,2,3].map(()=>`<div class="card"><div class="media">&nbsp;</div><div class="body"><div class="skeleton wide"></div><div class="skeleton short"></div></div></div>`).join('')}</section><div class="space"></div>${spinner('Cargando los servicios')}`);
 if(state==='error')return publicWrap(head+alert('No pudimos cargar los servicios','Comprueba tu conexión y vuelve a intentarlo.'));
 if(state==='conflict')return publicWrap(head+`<div class="alert warning" role="status"><strong>El listado puede haber cambiado</strong><span>Si abres un servicio que ya no está publicado, encontrarás la misma pantalla de ausencia que para una dirección inexistente.</span></div>`+card('Anillado espiral','Consultar precio','detail-conflict'));
 return publicWrap(head+`<div class="grid">${card(sample.name,'Consultar precio','detail',variant)}${card(sample.other,'Gratuito','detail','image')}${card('Servicio publicado','Precio: [importe configurado]','detail','image')}</div><p class="small" style="margin-top:var(--s5)">Los nombres son ejemplos editoriales, no catálogo de una instalación.</p>`);
}
function card(name,price,go,variant){return `<article class="card">${media(name,variant==='image'?'failed':'')}<div class="body"><h2>${name}</h2><p>Descripción breve del servicio, si está registrada.</p><div class="price">${price}</div><div class="actions">${button('Ver servicio',go,'primary')}</div></div></article>`}
function sDetail(state,variant){
 if(state==='empty'||state==='conflict'||variant==='unpublished')return publicWrap(empty('Este servicio no está disponible','Comprueba la dirección o vuelve a la lista de servicios.','list','Volver a servicios'));
 if(state==='error')return publicWrap(link('Volver a servicios','list')+alert('No pudimos cargar esta ficha','La consulta falló; puede que el servicio siga publicado. Intenta nuevamente.'));
 if(state==='loading')return publicWrap(link('Volver a servicios','list')+`<div class="hero"><div class="media tall">&nbsp;</div><div>${spinner('Cargando el servicio')}<div class="skeleton wide"></div><div class="skeleton short"></div></div></div>`);
 return publicWrap(link('Volver a servicios','list')+`<div class="space"></div><div class="hero">${media(sample.name,variant==='image'?'failed':'tall')}<section><div class="eyebrow">Servicio</div><h1>${sample.name}</h1><p class="desc">Descripción del servicio publicada por el negocio.</p><div class="price">Consultar precio</div><p class="muted">[Unidad descriptiva, si existe]</p><p class="small">Esta ficha informa: no compra, no reserva, no recibe órdenes.</p></section></div>`);
}
function sAdminList(state){const head=`<div class="admin-title"><div><h1>Servicios</h1><p class="muted">Organiza y publica la vitrina.</p></div>${button('Crear servicio','editor-empty','primary')}</div>`;
 if(state==='empty')return adminWrap(head+empty('Todavía no hay servicios','Crea un borrador para empezar a organizar la vitrina.','editor-empty','Crear servicio'));
 if(state==='loading')return adminWrap(head+spinner('Cargando los servicios')+`<div class="table">${[1,2,3].map(()=>`<div class="listrow"><div class="skeleton wide"></div><div class="skeleton short"></div></div>`).join('')}</div>`);
 if(state==='error')return adminWrap(head+alert('No pudimos cargar la vitrina','Comprueba la conexión antes de volver a intentarlo.'));
 if(state==='conflict')return adminWrap(head+alert('La lista cambió mientras la revisabas','Otra sesión pudo modificar el estado o el orden. Actualiza antes de editar o reordenar.','retry','Actualizar lista','warning')+adminRows());
 return adminWrap(head+adminRows());
}
function adminRows(){let rows=[[sample.name,'Publicado','Consultar precio','1'],[sample.other,'Borrador','Gratuito','2'],['Servicio archivado','Archivado','Consultar precio','3']];return `<div class="table"><div class="listrow headrow"><span>Servicio</span><span class="hide-mobile">Precio</span><span class="hide-mobile">Orden</span><span>Acciones</span></div>${rows.map(([name,status,price,order])=>`<div class="listrow"><div><strong>${name}</strong><div>${badge(status)} <span class="small">${price}</span></div></div><span class="hide-mobile">${price}</span><span class="hide-mobile">${order}</span><span>${button('Editar','editor')}</span></div>`).join('')}</div><p class="small" style="margin-top:var(--s3)">Reordenar es una operación contractual, no arrastrar por obligación. Los controles exactos se definirán tras aprobación.</p>`}
function sEditor(state,variant){const emptyMode=state==='empty';const conflict=state==='conflict'||variant==='simultaneous';const invalid=(state==='error'&&variant!=='network')||variant==='invalid';
 const head=`<div class="admin-title"><div><h1>${emptyMode?'Crear servicio':'Editar servicio'}</h1><p class="muted">${emptyMode?'Nuevo borrador':'Publicado · edición editorial'}</p></div>${badge(emptyMode?'Borrador':'Publicado')}</div>`;
 let main='';
 if(state==='loading')return adminWrap(head+spinner('Cargando el servicio')+`<div class="form"><div class="skeleton wide"></div><div class="skeleton wide"></div><div class="skeleton short"></div></div>`);
 if(conflict) main+=alert('Otra persona cambió este servicio','Tu edición no se ha guardado. Antes de ver la versión actual, ten presente que recargar puede descartar el texto que escribiste.','show-current','Ver versión actual','warning');
 if(invalid) main+=alert('Hay campos que necesitan corrección','Revisa los mensajes junto a cada campo; el contenido que escribiste sigue aquí.',null,null,'danger');
 const name=emptyMode?'':sample.name,slug=emptyMode?'':'anillado-espiral';
 main+=`<form class="form" onsubmit="event.preventDefault();showToast('Acción ilustrativa: no se ha guardado ningún servicio.')"><div class="field"><label for="f-name">Nombre del servicio *</label><input id="f-name" value="${name}" aria-invalid="${invalid}" ${invalid?'aria-describedby="err-name"':''} />${invalid?'<span class="error" role="alert" id="err-name">El nombre del servicio es obligatorio.</span>':''}</div><div class="field"><label for="f-slug">Dirección pública (slug) *</label><input id="f-slug" value="${slug}" aria-invalid="${invalid}" />${invalid?'<span class="error">Esa dirección ya se utiliza. Escribe otra.</span>':''}<small class="muted">No cambia automáticamente al renombrar.</small></div><div class="field"><label for="f-short">Descripción breve</label><textarea id="f-short">${emptyMode?'':'Descripción editorial del servicio.'}</textarea></div><div class="field"><label for="f-full">Descripción completa</label><textarea id="f-full"></textarea><small class="muted">Es necesaria al menos una descripción.</small></div><div class="form-row"><div class="field"><label for="f-price">Precio</label><input id="f-price" inputmode="decimal" placeholder="Vacío = consultar; 0 = gratuito" ${invalid?'aria-invalid="true"':''}><small class="muted">No introduzcas importes negativos.</small></div><div class="field"><label for="f-unit">Unidad descriptiva</label><input id="f-unit" placeholder="Opcional"></div></div><div class="field"><label>Medio de CORE (opcional)</label>${media(sample.name,variant==='image'?'failed':'tall')}<div class="actions">${button('Seleccionar archivo de CORE','media')}</div><small class="muted">Cuando hay imagen, el texto alternativo es obligatorio.</small></div><div class="field"><label for="f-alt">Texto alternativo de la imagen</label><input id="f-alt" placeholder="Describe la imagen si existe"></div><hr class="divider"><div class="actions"><button class="btn primary" type="submit">Guardar borrador</button>${!emptyMode?button('Publicar','publish'):''}${!emptyMode?button('Retirar','unpublish'):''}${!emptyMode?button('Archivar','archive','danger'):''}</div><div class="keyboard-note">Móvil: acciones en el flujo del documento, sin barra fija que oculte campos cuando aparece el teclado.</div></form>`;
 if(variant==='network')main+=alert('No pudimos guardar','Los datos no se enviaron. Revisa la conexión e intenta nuevamente.','retry','Reintentar');
 return adminWrap(head+main);
}
function sNav(state,variant){const off=variant==='off'||state==='conflict';const act=state==='data';if(off)return `<div class="page"><h1>Sin M05a: no existe superficie</h1><p class="desc">Esta representación está FUERA del viewport del producto: con el módulo desactivado desaparecen rutas, enlaces y contribuciones. No se dibuja una pantalla «Módulo desactivado».</p>${button('Volver a la composición activa','nav-active','primary')}</div>`;
 const lead=`<h1>Contribuciones a navegación</h1><p class="desc">El armazón compone módulos activos, no reserva lugares vacíos. La posición de la invitación pública queda pendiente de JP.</p>`;
 if(state==='loading')return `<div class="page">${lead}${spinner('Comprobando capacidades')}<p class="small">No dibujar una ruta que todavía no se ha confirmado.</p></div>`;
 if(state==='error')return `<div class="page">${lead}${alert('No pudimos comprobar las capacidades','No confundir este fallo con la ausencia del módulo. La recuperación pertenece a la plataforma.')}</div>`;
 return `<div class="page">${lead}<h2>Administración · capacidad activa</h2><div class="nav-callout">Grupo «Servicios» · ${button('Servicios','admin-list','primary')}<p class="small">Solo con rol autorizado; ruta no existe si se desactiva.</p></div><h2>Portada pública · composición sugerida</h2><div class="nav-callout">${act?empty('Servicios','Conoce los servicios publicados.','list','Ver servicios'):empty('Sin invitación pública','Con el módulo activo pero sin publicaciones, la portada no enlaza a un listado vacío.')}<p class="small">No define navegación pública global nueva; requiere aprobación del orden por JP.</p></div><h2>Listado directo</h2><div class="nav-callout">${button('Abrir /servicios','list','primary')}<p class="small">La ruta existe con módulo activo, incluso sin publicaciones, y presenta su estado vacío correspondiente.</p></div></div>`;
}
function render(){const surface=val('surface'),state=val('state'),variant=val('variant');$('stage').className='stage '+val('device');document.documentElement.dataset.theme=val('theme');
 let out=surface==='list'?sList(state,variant):surface==='detail'?sDetail(state,variant):surface==='admin-list'?sAdminList(state):surface==='editor'?sEditor(state,variant):sNav(state,variant);
 $('render').innerHTML=out+`<div class="demo-note">Propuesta · ${$('surface').selectedOptions[0].textContent} · ${$('state').selectedOptions[0].textContent} · ${$('device').selectedOptions[0].textContent}. No representa datos reales ni implementación.</div>`;
 $('render').querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();navigate(el.dataset.go)}));
}
function navigate(go){switch(go){case 'list':$('surface').value='list';$('state').value='data';break;case 'detail':$('surface').value='detail';$('state').value='data';break;case 'detail-conflict':$('surface').value='detail';$('state').value='conflict';break;case 'admin-list':$('surface').value='admin-list';$('state').value='data';drawer=false;break;case 'editor':$('surface').value='editor';$('state').value='data';break;case 'editor-empty':$('surface').value='editor';$('state').value='empty';break;case 'nav':$('surface').value='nav';$('state').value='data';drawer=false;break;case 'nav-active':$('surface').value='nav';$('state').value='data';$('variant').value='normal';break;case 'drawer':drawer=true;break;case 'close-drawer':drawer=false;break;case 'show-current':showToast('Referencia: antes de recargar, el producto debe tratar el riesgo de perder los cambios escritos.');break;case 'media':showToast('Referencia al selector de archivos CORE; no se ha abierto ningún archivo.');break;case 'archive':showToast('Referencia: usar ConfirmDialog compartido antes de archivar.');break;case 'unpublish':showToast('Referencia: usar contrato de retirada aprobado.');break;case 'publish':showToast('Referencia: validar publicación en operación; ninguna acción fue enviada.');break;case 'retry':showToast('Referencia: el reintento real corresponde al servicio HTTP del producto.');break;default:break}render()}
function showToast(message){$('comment').textContent=message}
['surface','state','device','theme','variant'].forEach(id=>$(id).addEventListener('change',()=>{drawer=false;render()}));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=false;render()}});render();
</script>
</body></html>
